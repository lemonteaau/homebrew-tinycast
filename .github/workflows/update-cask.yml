name: Refresh fork cask

on:
  schedule:
    - cron: '31 21 * * *'
  workflow_dispatch:
  workflow_call:
    secrets:
      TAP_DEPLOY_KEY:
        required: true

permissions:
  contents: write

concurrency:
  group: refresh-cask
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'lemonteaau/homebrew-tinycast' || github.repository == 'lemonteaau/tinycast'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: lemonteaau/homebrew-tinycast
          ref: main
          ssh-key: ${{ secrets.TAP_DEPLOY_KEY }}

      - name: Test cask publication
        run: python3 -m unittest discover -s Tests -v

      - name: Verify release and publish cask
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 Scripts/update-cask.py
